[project]
name = "field-ops"
version = "0.1.0"
description = "Clean messy field fault reports and surface recurring issues, MTTR and vendor performance."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "rapidfuzz>=3.9",
    "openpyxl>=3.1",
    "scikit-learn>=1.5",
    "streamlit>=1.38",
    "plotly>=5.24",
]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
field-ops = "field_ops.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/field_ops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
